name: Deploy Production

on:
  push:
    branches: [ deploy ]

jobs:
  frontend-deploy-check:
    name: Build Frontend for Cloudflare Pages (Blacksmith)
    runs-on: blacksmith
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Frontend Dependencies
        working-directory: frontend
        run: npm ci

      - name: Build Frontend Distribution
        working-directory: frontend
        run: npm run build

  backend-deploy:
    name: Deploy Backend to Render (Blacksmith)
    runs-on: blacksmith
    needs: frontend-deploy-check
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Trigger Render Deploy Webhook
        if: ${{ env.RENDER_DEPLOY_HOOK != '' }}
        env:
          RENDER_DEPLOY_HOOK: ${{ secrets.RENDER_DEPLOY_HOOK }}
        run: |
          echo "Triggering Render deployment webhook..."
          curl -f -X POST "$RENDER_DEPLOY_HOOK"
