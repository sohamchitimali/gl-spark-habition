name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  frontend-check:
    name: Frontend Build & Typecheck (Blacksmith)
    runs-on: blacksmith
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Frontend Dependencies
        working-directory: frontend
        run: npm ci

      - name: Verify Frontend Production Build
        working-directory: frontend
        run: npm run build

  backend-check:
    name: Backend Compile Check (Blacksmith)
    runs-on: blacksmith
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'maven'

      - name: Verify Backend Services Compile
        run: |
          for service in EurekaServer ApiGateway AuthService GroupService HabitService NotificationService; do
            echo "::group::Compiling $service"
            (cd backend/$service && ./mvnw test-compile -DskipTests)
            echo "::endgroup::"
          done
