<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Static 2D Layered Coin</title>
<style>
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: transparent;
    font-family: sans-serif;
  }

  /* The main static coin container */
  .static-coin {
    position: relative;
    width: 200px;
    height: 200px;
    border-radius: 50%;

    /* Clean diagonal light sweep */
    background: linear-gradient(135deg, #FDE074 0%, #D4AF37 45%, #B58500 100%);

    /* Sharp box-shadow stops create the physical "stepped" layers of a minted coin */
    box-shadow:
      inset 0 0 0 4px #FFF3A1,                   /* 1. Outer bright highlight lip */
      inset 0 0 2px 5px rgba(139, 101, 8, 0.7),  /* 2. Sharp dark crevice/bevel */
      inset 0 0 0 14px rgba(232, 193, 74, 0.8),  /* 3. Raised inner stepped ring */
      inset 0 0 12px 14px rgba(90, 60, 10, 0.5); /* 4. Soft shadow dropping onto the flat center */
    display: flex;
    align-items: center;
    justify-content: center;
  }

  /* The 3x3 Grid */
  .grid-container {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 6px;
    width: 100px;
    height: 100px;
    /* Subtle drop shadow so the grid pops off the flat center */
    filter: drop-shadow(1.5px 1.5px 2px rgba(100, 70, 10, 0.5));
  }

  .grid-cell {
    background: #E8C14A;
    border-radius: 3px;
    /* Clean, bright embossed look */
    box-shadow:
      inset -1.5px -1.5px 3px rgba(160, 110, 20, 0.8),
      inset 1.5px 1.5px 3px rgba(255, 245, 190, 0.9);
  }
</style>
</head>
<body>

  <div class="static-coin">
    <div class="grid-container">
      <div class="grid-cell"></div><div class="grid-cell"></div><div class="grid-cell"></div>
      <div class="grid-cell"></div><div class="grid-cell"></div><div class="grid-cell"></div>
      <div class="grid-cell"></div><div class="grid-cell"></div><div class="grid-cell"></div>
    </div>
  </div>

</body>
</html>
