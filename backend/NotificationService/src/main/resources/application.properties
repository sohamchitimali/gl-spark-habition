# Server Port
server.port=${NOTIFICATION_PORT:8084}

# Application Name
spring.application.name=NOTIFICATION-SERVICE

# Eureka Client
eureka.client.service-url.defaultZone=${EUREKA_URL:http://localhost:8761/eureka/}
eureka.instance.prefer-ip-address=true

# Database Configuration
spring.datasource.url=${DB_URL_NOTIFICATIONS:jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:habition_notifications}?sslmode=${DB_SSLMODE:disable}&currentSchema=${DB_SCHEMA_NOTIFICATIONS:habition_notifications}}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:root}
spring.datasource.driver-class-name=org.postgresql.Driver

# Serverless PostgreSQL Connection Pool Tuning
spring.datasource.hikari.maximum-pool-size=${DB_POOL_MAX:5}
spring.datasource.hikari.minimum-idle=${DB_POOL_MIN:1}
spring.datasource.hikari.idle-timeout=30000
spring.datasource.hikari.max-lifetime=60000
spring.datasource.hikari.connection-timeout=20000

# JPA Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.default_schema=${DB_SCHEMA_NOTIFICATIONS:habition_notifications}

# JobRunr Configuration
org.jobrunr.background-job-server.enabled=true
org.jobrunr.dashboard.enabled=true
org.jobrunr.dashboard.port=${JOBRUNR_DASHBOARD_PORT:8000}

# Gemini AI
gemini.api.url=${GEMINI_API_URL:https://generativelanguage.googleapis.com/v1beta/models/gemma-4-31b-it:generateContent}
gemini.api.key=${GEMINI_API_KEY:}

# Email Configuration
spring.mail.host=${SPRING_MAIL_HOST:smtp.gmail.com}
spring.mail.port=${SPRING_MAIL_PORT:587}
spring.mail.username=${SPRING_MAIL_USERNAME:}
spring.mail.password=${SPRING_MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# Service URLs
auth.service.url=${AUTH_SERVICE_URL:http://localhost:8081}
habit.service.url=${HABIT_SERVICE_URL:http://localhost:8083}
group.service.url=${GROUP_SERVICE_URL:http://localhost:8082}
api.gateway.url=${API_GATEWAY_URL:http://localhost:8080}
frontend.url=${FRONTEND_URL:http://localhost:5173}
gemini.unsubscribe.secret=${HMAC_SECRET:default-dev-secret-key-123456}

spring.cloud.openfeign.circuitbreaker.enabled=true

