# Server Port
server.port=8084

# Application Name
spring.application.name=NOTIFICATION-SERVICE

# Eureka Client
eureka.client.service-url.defaultZone=${EUREKA_URL:http://localhost:8761/eureka/}
eureka.instance.prefer-ip-address=true

# Database Configuration
spring.datasource.url=${DB_URL_NOTIFICATIONS:jdbc:postgresql://localhost:5432/habition_notifications}
spring.datasource.username=postgres
spring.datasource.password=root
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# JobRunr Configuration
org.jobrunr.background-job-server.enabled=true
org.jobrunr.dashboard.enabled=true
org.jobrunr.dashboard.port=8000

# Gemini AI
gemini.api.url=https://generativelanguage.googleapis.com/v1beta/models/gemma-4-31b-it:generateContent
gemini.api.key=${GEMINI_API_KEY}

# Email Configuration
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${SPRING_MAIL_USERNAME}
spring.mail.password=${SPRING_MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# Service URLs
auth.service.url=${AUTH_SERVICE_URL:http://localhost:8081}
habit.service.url=${HABIT_SERVICE_URL:http://localhost:8083}
group.service.url=${GROUP_SERVICE_URL:http://localhost:8082}
api.gateway.url=${API_GATEWAY_URL:http://localhost:8080}
frontend.url=${FRONTEND_URL:http://localhost:5173}
gemini.unsubscribe.secret=${HMAC_SECRET:default-dev-secret-key-123456}

spring.cloud.openfeign.circuitbreaker.enabled=true

