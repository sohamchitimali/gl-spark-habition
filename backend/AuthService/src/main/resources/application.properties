# Server Port
server.port=8081

# Application Name
spring.application.name=AUTH-SERVICE

# Eureka Client
eureka.client.service-url.defaultZone=${EUREKA_URL:http://localhost:8761/eureka/}
eureka.instance.prefer-ip-address=true

# Database Configuration
spring.datasource.url=${DB_URL_USERS:jdbc:postgresql://localhost:5432/habition_users}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:root}
spring.datasource.driver-class-name=org.postgresql.Driver

# Serverless PostgreSQL Connection Pool Tuning
spring.datasource.hikari.maximum-pool-size=${DB_POOL_MAX:5}
spring.datasource.hikari.minimum-idle=${DB_POOL_MIN:1}
spring.datasource.hikari.idle-timeout=30000
spring.datasource.hikari.max-lifetime=60000
spring.datasource.hikari.connection-timeout=20000

# JPA Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.default_schema=${DB_SCHEMA_USERS:public}

# JWT Configuration
jwt.secret=${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
jwt.expiration=900000
jwt.refresh-expiration=604800000

# Meilisearch
meilisearch.host=${MEILISEARCH_HOST:http://localhost:7700}
meilisearch.api-key=${MEILISEARCH_MASTER_KEY}

# Resilience4j Circuit Breaker Config for Meilisearch
resilience4j.circuitbreaker.instances.meilisearch.registerHealthIndicator=true
resilience4j.circuitbreaker.instances.meilisearch.slidingWindowSize=5
resilience4j.circuitbreaker.instances.meilisearch.permittedNumberOfCallsInHalfOpenState=3
resilience4j.circuitbreaker.instances.meilisearch.waitDurationInOpenState=30s
resilience4j.circuitbreaker.instances.meilisearch.failureRateThreshold=50
resilience4j.circuitbreaker.instances.meilisearch.minimumNumberOfCalls=2

# Email Configuration
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${SPRING_MAIL_USERNAME}
spring.mail.password=${SPRING_MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
