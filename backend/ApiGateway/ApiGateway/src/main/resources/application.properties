# Server Port
server.port=8080

# Application Name
spring.application.name=API-GATEWAY

# Eureka Client Configuration
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.instance.prefer-ip-address=true

# JWT Secret (MUST match the secret in Auth Service)
jwt.secret=404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970

# Spring Cloud Gateway Routes
spring.cloud.gateway.routes[0].id=auth-service
spring.cloud.gateway.routes[0].uri=lb://AUTH-SERVICE
spring.cloud.gateway.routes[0].predicates[0]=Path=/auth/**

spring.cloud.gateway.routes[1].id=group-service
spring.cloud.gateway.routes[1].uri=lb://GROUP-SERVICE
spring.cloud.gateway.routes[1].predicates[0]=Path=/groups/**

spring.cloud.gateway.routes[2].id=habit-service
spring.cloud.gateway.routes[2].uri=lb://HABIT-SERVICE
spring.cloud.gateway.routes[2].predicates[0]=Path=/habits/**

spring.cloud.gateway.routes[3].id=coin-service
spring.cloud.gateway.routes[3].uri=lb://COIN-SERVICE
spring.cloud.gateway.routes[3].predicates[0]=Path=/coins/**,/competitions/**

spring.cloud.gateway.routes[4].id=habit-users
spring.cloud.gateway.routes[4].uri=lb://HABIT-SERVICE
spring.cloud.gateway.routes[4].predicates[0]=Path=/users/**

# Global CORS Configuration
spring.cloud.gateway.globalcors.cors-configurations.[/**].allowed-origins=http://localhost:5173,http://localhost:5174
spring.cloud.gateway.globalcors.cors-configurations.[/**].allowed-methods=GET,POST,PUT,PATCH,DELETE,OPTIONS
spring.cloud.gateway.globalcors.cors-configurations.[/**].allowed-headers=*
spring.cloud.gateway.globalcors.cors-configurations.[/**].allow-credentials=true
spring.cloud.gateway.globalcors.cors-configurations.[/**].max-age=3600
# Required so OPTIONS preflight requests bypass the JWT filter and receive CORS headers
spring.cloud.gateway.globalcors.add-to-simple-url-handler-mapping=true